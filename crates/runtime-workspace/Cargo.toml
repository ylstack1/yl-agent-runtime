[package]
name = "runtime-workspace"
version = { workspace = true }
edition = "2021"
license = { workspace = true }
repository = { workspace = true }
description = "YL Agent Runtime workspace service - safe project discovery and file operations"

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
walkdir = "2.5"
encoding_rs = "0.8"
encoding_rs_io = "0.1"
async-trait = "0.1"
tempfile = { workspace = true }
diffy = { workspace = true }
ignore = { workspace = true }
globset = { workspace = true }
regex = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
runtime-core = { path = "../runtime-core" }
runtime-config = { path = "../runtime-config" }
runtime-policy = { path = "../runtime-policy" }
runtime-audit = { path = "../runtime-audit" }

# Test-only: privilege-free NTFS junction creation for the realpath re-containment
# test (symlink_dir requires Developer Mode/admin; junctions do not).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_SystemServices",
] }

