[workspace]
resolver = "2"
members = [
    "crates/runtime-core",
    "crates/runtime-daemon",
    "crates/runtime-cli",
    "crates/runtime-protocol",
    "crates/runtime-policy",
    "crates/runtime-identity",
    "crates/runtime-approval",
    "crates/runtime-workspace",
    "crates/runtime-process",
    "crates/runtime-terminal",
    "crates/runtime-toolchain",
    "crates/runtime-audit",
    "crates/runtime-mcp",
    "crates/runtime-transport",
    "crates/runtime-backend-api",
    "crates/backend-native",
    "crates/backend-windows",
    "crates/backend-linux",
    "crates/backend-macos",
    "crates/backend-arapuca",
    "crates/backend-virtx",
    "crates/runtime-config",
    "crates/runtime-testkit",
]
exclude = [
    "apps/desktop-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yl-stack/yl-agent-runtime"
description = "YL Agent Runtime - Unified Portable Agent Execution Runtime"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.12", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
figment = { version = "0.11", features = ["toml", "env", "serialize"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
sqlite = "0.37"

# Cryptography
ring = "0.17"
ed25519-dalek = "2.1"
x25519-dalek = "2.1"
blake3 = "1.5"
zeroize = "1.7"
rand = "0.8"
rand_chacha = "0.3"

# MCP
rmcp = { version = "3.10", features = ["server", "transport-stdio", "transport-http"] }

# Transport
iroh = { version = "1.4", features = ["net", "blobs", "docs", "discovery-n0"], optional = true }

# IPC
tokio-util = { version = "0.7", features = ["codec", "io", "sync"] }
bytes = "1.5"

# Platform detection
target-lexicon = "0.12"

# Testing
tempfile = "3.10"
proptest = "1.4"

# Windows-specific
[target.'cfg(windows)'.workspace.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_ProcessSnapshot",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_System_Token",
    "Win32_System_Environment",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
winreg = "0.11"
conpty = "0.4"
rappct = { version = "0.13", optional = true }

# Linux-specific
[target.'cfg(target_os = "linux")'.workspace.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["process", "sys", "signal", "fcntl", "pty", "unistd"] }
landlock = "0.6"
seccomp = "0.8"
cgroups = "0.3"
arapuca = { version = "0.2", optional = true }

# macOS-specific
[target.'cfg(target_os = "macos")'.workspace.dependencies]
libc = "0.2"
nix = { version = "0.28", features = ["process", "sys", "signal", "fcntl", "pty", "unistd"] }
core-foundation = "0.9"
core-foundation-sys = "0.8"
security-framework = "2.10"
arapuca = { version = "0.2", optional = true }

# PTY (cross-platform)
portable-pty = { version = "0.9", features = ["conpty", "pty-system"] }

# Tauri (optional, for desktop app)
tauri = { version = "2.0", features = ["tray-icon", "cli"], optional = true }
tauri-plugin-shell = { version = "2.0", optional = true }
tauri-plugin-fs = { version = "2.0", optional = true }
tauri-plugin-dialog = { version = "2.0", optional = true }
tauri-plugin-opener = { version = "2.0", optional = true }
tauri-plugin-notification = { version = "2.0", optional = true }

[workspace.lints]
rust = "2021"
clippy::all = "warn"
clippy::pedantic = "warn"
clippy::nursery = "warn"
clippy::cargo = "warn"
clippy::unwrap_used = "allow"
clippy::expect_used = "allow"
clippy::panic = "allow"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
debug = true
opt-level = 0