[workspace]
resolver = "2"
members = [
    "crates/runtime-core",
    "crates/runtime-daemon",
    "crates/runtime-cli",
    "crates/runtime-protocol",
    "crates/runtime-policy",
    "crates/runtime-identity",
    "crates/runtime-approval",
    "crates/runtime-workspace",
    "crates/runtime-process",
    "crates/runtime-terminal",
    "crates/runtime-toolchain",
    "crates/runtime-undo",
    "crates/runtime-audit",
    "crates/runtime-mcp",
    "crates/runtime-transport",
    "crates/runtime-backend-api",
    "crates/backend-native",
    "crates/backend-windows",
    "crates/backend-linux",
    "crates/backend-macos",
    "crates/backend-arapuca",
    "crates/backend-virtx",
    "crates/runtime-config",
    "crates/runtime-testkit",
]
exclude = [
    "apps/desktop-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yl-stack/yl-agent-runtime"
description = "YL Agent Runtime - Unified Portable Agent Execution Runtime"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
uuid = { version = "1.12", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
figment = { version = "0.10", features = ["toml", "env"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
sqlite = "0.37"

# Cryptography
ring = "0.17"
ed25519-dalek = "2.1"
x25519-dalek = "3.0"
blake3 = "1.5"
zeroize = "1.7"
rand = "0.8"
rand_chacha = "0.3"

# MCP
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }

# Transport
iroh = "1.4"

# HTTP transport (Streamable HTTP MCP)
axum = "0.8"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# HTTP client (for CLI approval commands talking to the running server)
reqwest = { version = "0.12", features = ["json"] }

# IPC
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1.5"

# Platform detection
target-lexicon = "0.12"
# JSON Schema generation (used by runtime-protocol tool schemas)
schemars = "0.8"

# Testing
tempfile = "3.10"
proptest = "1.4"
which = "6.0"

# Phase 1 toolset: diffs, gitignore-aware walking, globs, hashing
diffy = "0.5"
ignore = "0.4"
globset = "0.4"
regex = "1.11"
sha2 = "0.10"
base64 = "0.22"

# Platform-specific dependencies (declared here so crate manifests can
# reference them with { workspace = true }; each crate gates actual use via
# #[cfg(target_os = "...")] in its source code).
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Environment",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
winreg = "0.11"
conpty = "0.4"
libc = "0.2"
nix = "0.28"
landlock = "0.4"
seccomp = "0.1"
cgroups = "0.1"
core-foundation = "0.9"
core-foundation-sys = "0.8"
security-framework = "2.10"

# PTY (cross-platform)
portable-pty = "0.9"

# Tauri (optional, for desktop app - excluded from workspace)
tauri = { version = "2.0", features = ["tray-icon", "cli"] }
tauri-plugin-shell = { version = "2.0" }
tauri-plugin-fs = { version = "2.0" }
tauri-plugin-dialog = { version = "2.0" }
tauri-plugin-opener = { version = "2.0" }
tauri-plugin-notification = { version = "2.0" }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"

[profile.release]
strip = true
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.dev]
debug = true
opt-level = 0